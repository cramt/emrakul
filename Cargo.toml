[package]
name = "emrakul"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cramt/emrakul"

[dependencies]
anyhow = "1"
cosmic-text = { version = "0.19.0", default-features = false, features = ["swash", "std"] }
evdev = "0.13.2"
facet = "0.46"
facet-toml = "0.46"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reis = { version = "0.7.1", features = ["calloop"] }
resvg = { version = "0.48.1", default-features = false }
rustix = { version = "1", features = ["fs", "process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tiny-skia = "0.12"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "net"] }
# Only for the TLS-over-TCP plumbing: certs are checked by our own pin
# (src/ssap/tls.rs), never against a root store.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pinned to the rev niri 26.04 ships, because that exact code is what was seen
# driving ganymede's TV off its GTX 1050 Ti (Pascal, legacy 580 driver) before
# any of this was written. Move it deliberately, and re-test on that box.
[dependencies.smithay]
git = "https://github.com/Smithay/smithay.git"
rev = "ff5fa7df392cecfba049ffed55cdaa4e98a8e7ef"
default-features = false
features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "desktop",
    "renderer_gl",
    "wayland_frontend",
]

[dependencies.smithay-drm-extras]
# Only the connector scanner. display-info (EDID make/model for wl_output) is
# off until something shows those names.
default-features = false
git = "https://github.com/Smithay/smithay.git"
rev = "ff5fa7df392cecfba049ffed55cdaa4e98a8e7ef"
